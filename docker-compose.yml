version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: daily_taskbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: daily_taskbook
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: change-this-in-production
      CLIENT_URL: http://localhost:5000
    depends_on:
      - db

volumes:
  pgdata:
